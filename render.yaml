services:
  - type: web
    name: tycoonvale-backend
    runtime: node
    plan: free
    buildCommand: "cd shared && npm install && npm run build && cd ../server && npm install && npm run build"
    startCommand: "cd server && npm start"
    healthCheckPath: "/api/health"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: "*"
      - key: MONGODB_URI
        sync: false
